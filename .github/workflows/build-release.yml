name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev libsdl2-dev libsdl2-mixer-dev libsdl2-image-dev

      - name: Install Python dependencies
        run: pip install pygame pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --name "UltimosRastros-Linux" --add-data "assets:assets" main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltimosRastros-Linux
          path: dist/UltimosRastros-Linux

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pygame pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --name "UltimosRastros-Windows" --add-data "assets;assets" --noconsole --icon "assets\logo_jogo.ico" main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltimosRastros-Windows
          path: dist/UltimosRastros-Windows.exe

  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: UltimosRastros-Linux
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: UltimosRastros-Windows
          path: artifacts/

      - name: Make Linux binary executable
        run: chmod +x artifacts/UltimosRastros-Linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Últimos Rastros ${{ github.ref_name }}"
          body: |
            ## Últimos Rastros ${{ github.ref_name }}

            Jogo 2D de plataforma inspirado no folclore brasileiro. Controle o Curupira e recupere memórias perdidas.

            ### Download

            | Sistema | Arquivo |
            |---|---|
            | Windows | `UltimosRastros-Windows.exe` |
            | Linux | `UltimosRastros-Linux` |

            ### Como executar

            **Windows:** Baixe e execute `UltimosRastros-Windows.exe`

            **Linux:**
            ```bash
            chmod +x UltimosRastros-Linux
            ./UltimosRastros-Linux
            ```
          files: |
            artifacts/UltimosRastros-Linux
            artifacts/UltimosRastros-Windows.exe
          draft: false
          prerelease: false
